name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# The forge runners run steps in host mode, inside a shared alpine container with no apt-get,
# sudo, python3 or pio. The build goes through "docker run": the daemon is the host's, and the
# workdir is mounted at the same path on both sides, hence "-v $PWD:$PWD".
env:
  BUILD_IMAGE: node:22-bookworm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware and filesystem
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="$GITHUB_REF_NAME"; else name="${GITHUB_SHA::7}"; fi
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -v lightsaber-pio:/root/.platformio \
            "$BUILD_IMAGE" bash ci/build.sh "$name"
          echo "BIN_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: light-saber-${{ env.BIN_NAME }}
          path: bin/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        # On the runner, which reaches the forge by its internal address; no jq or python3,
        # the JSON is read by the runner's node.
        env:
          TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          id=$(curl -sf -X POST "$api/releases" \
            -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"Release ${GITHUB_REF_NAME}\",\"body\":\"OTA files: flash the LittleFS .bin, then the firmware .bin (see OTA_UPDATE.md).\"}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).id))')
          for f in bin/*; do
            curl -sf -X POST "$api/releases/$id/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f" > /dev/null
          done
