# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
- build
- test
- upload
- release
- deploy
- review
- dast
- staging
- canary
- production
- incremental rollout 10%
- incremental rollout 25%
- incremental rollout 50%
- incremental rollout 100%
- performance
- cleanup
sast:
  stage: test
include:
- template: Auto-DevOps.gitlab-ci.yml

variables:
  # Package version can only contain numbers (0-9), and dots (.).
  # Must be in the format of X.Y.Z, i.e. should match /\A\d+\.\d+\.\d+\z/ regular expresion.
  # See https://docs.gitlab.com/ee/user/packages/generic_packages/#publish-a-package-file
  FIRMWARE_BINARY_COMMIT: "light-saber-firmeware-${CI_COMMIT_SHORT_SHA}.bin"
  LITTLEFS_BINARY_COMMIT: "light-saber-littlefs-${CI_COMMIT_SHORT_SHA}.bin"
  FIRMWARE_BINARY_TAG: "light-saber-firmeware-${CI_COMMIT_TAG}.bin"
  LITTLEFS_BINARY_TAG: "light-saber-littlefs-${CI_COMMIT_TAG}.bin"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/releases/${CI_COMMIT_TAG}"

build:
  stage: build
  image: infinitecoding/platformio-for-ci:latest
  before_script:
    - chmod +x ./install-build-env.sh
    - ./install-build-env.sh
  script: 
    - source ~/.bashrc
    - cd app
    - npm install
    - npm run build
    - cd ..
    - pio run --target buildfs --environment light-saber
    - pio run --environment light-saber
    - mkdir ./bin
    - "mv ./.pio/build/light-saber/littlefs.bin ./bin/${LITTLEFS_BINARY_COMMIT}"
    - "mv ./.pio/build/light-saber/firmware.bin ./bin/${FIRMWARE_BINARY_COMMIT}"
  artifacts:
    paths:
      - ./bin/${LITTLEFS_BINARY_COMMIT}
      - ./bin/${FIRMWARE_BINARY_COMMIT}

upload:
  stage: upload
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file bin/${LITTLEFS_BINARY_COMMIT} "${PACKAGE_REGISTRY_URL}/${LITTLEFS_BINARY_TAG}"
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file bin/${FIRMWARE_BINARY_COMMIT} "${PACKAGE_REGISTRY_URL}/${FIRMWARE_BINARY_TAG}"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script: echo "Running the release job for the new tag."
  release:                               # See https://docs.gitlab.com/ee/ci/yaml/#release for available properties
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: 'OTA file to upgrade the app and controller of your boardgame table. For update process see the readme'