; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:light-saber]
; Arduino core 3 (ESP-IDF 5): firmware is ~1.5 MB, hence the custom partitions.csv
platform = espressif32@^8
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
	fastled/FastLED@^3.10.3
	ayushsharma82/ElegantOTA@^4.0.0
	bblanchon/ArduinoJson@^7.4.2
	esp32async/AsyncTCP@^3.5.0
	esp32async/ESPAsyncWebServer@^3.12.1
	mokolea/InputDebounce@^1.6.0
	knolleary/PubSubClient@^2.8
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
	-DMQTT_MAX_PACKET_SIZE=1024
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
extra_scripts =
	pre:scripts/reproducible.py
	scripts/prebuild.py

; Static Code Analysis Configuration
check_tool = cppcheck
check_flags =
	--enable=all
	--suppress=missingIncludeSystem
	--suppress=unusedFunction
	--suppress=unmatchedSuppression
	--std=c++17
	-DESP32
	-DARDUINO=10819
	--inline-suppr
