<div
    x-show="$store.notifs.open"
    :class="{ 'bg-green-400': $store.notifs.code === 'success', 'bg-red-400': $store.notifs.code === 'error' }"
    class="px-8 py-6 text-white flex justify-between rounded mt-2"
    @click.outside="$store.notifs.toggle()"
>
    <div class="flex items-center">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7 mr-6"
            viewBox="0 0 20 20"
            fill="currentColor"
        >
            <path
                d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"
            />
        </svg>
        <p x-text="$store.notifs.text"></p>
    </div>
    <button
        class="hover:text-white"
        :class="{ 'text-green-100': $store.notifs.code === 'success', 'text-red-100': $store.notifs.code === 'error' }"
        @click="$store.notifs.toggle()"
    >
        <icon src="icons/close.svg" class="h-6 w-6"></icon>
    </button>
</div>
