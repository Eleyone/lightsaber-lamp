<div
    class="bg-gray-50 px-4 py-2 sm:px-6 rounded border border-gray-200"
    x-data="versionInfo()"
    @load.window="init()"
>
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Version Information</h3>
        <span
            class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded"
            x-text="status"
        ></span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Firmware Version -->
        <div class="bg-white p-3 rounded border border-gray-200">
            <p class="text-sm font-medium text-gray-500">Firmware Version</p>
            <p class="text-2xl font-bold text-gray-900" x-text="firmware || 'Loading...'"></p>
            <p class="text-xs text-gray-400 mt-1" x-text="firmwareBuildDate || '—'"></p>
        </div>

        <!-- App Version -->
        <div class="bg-white p-3 rounded border border-gray-200">
            <p class="text-sm font-medium text-gray-500">Web App Version</p>
            <p class="text-2xl font-bold text-gray-900" x-text="app || 'Loading...'"></p>
            <p class="text-xs text-gray-400 mt-1" x-text="appBuildDate || '—'"></p>
        </div>
    </div>

    <!-- Version Details -->
    <div class="mt-4 text-sm text-gray-600 bg-white p-3 rounded border border-gray-200">
        <p class="font-medium text-gray-900 mb-2">Details</p>
        <ul class="space-y-1">
            <li>
                <span class="font-medium">Device:</span>
                <span x-text="deviceInfo || '—'"></span>
            </li>
            <li>
                <span class="font-medium">Last Updated:</span>
                <span x-text="lastUpdated || 'Never'"></span>
            </li>
            <li>
                <span class="font-medium">Uptime:</span>
                <span x-text="uptime || '—'"></span>
            </li>
        </ul>
    </div>

    <!-- Error State -->
    <div
        x-show="error"
        class="mt-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded"
        style="display: none"
    >
        <p class="text-sm" x-text="error"></p>
    </div>
</div>

<script>
function versionInfo() {
    return {
        firmware: null,
        app: null,
        firmwareBuildDate: null,
        appBuildDate: null,
        deviceInfo: 'LightSaber Lamp ESP32',
        lastUpdated: null,
        uptime: null,
        status: 'Up to date',
        error: null,

        async init() {
            try {
                // Fetch firmware version
                const fwResponse = await fetch('/api/version');
                const fwData = await fwResponse.json();
                this.firmware = fwData.firmware;
                this.firmwareBuildDate = `Built: ${fwData.build_date}`;

                // Fetch app version
                const appResponse = await fetch('/version.json');
                const appData = await appResponse.json();
                this.app = appData.app;
                this.appBuildDate = `Built: ${new Date(appData.buildDate).toLocaleString()}`;
                this.lastUpdated = new Date(appData.buildDate).toLocaleDateString();

                // Compare versions
                this.checkVersions();
            } catch (err) {
                console.error('Error loading version information:', err);
                this.error = 'Could not load version information. Please refresh the page.';
                this.status = 'Error';
            }
        },

        checkVersions() {
            // Simple check - in production you might compare semantic versions
            if (this.firmware && this.app) {
                this.status = 'Up to date';
            }
        }
    };
}
</script>
